name: test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, ci-probe]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web/ が未作成の間はスキップ(スキャフォールド後にそのまま有効になる)
      - name: web build & test
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npm run build
            npm test --if-present
          else
            echo "web/ はまだ無いのでスキップ"
          fi
